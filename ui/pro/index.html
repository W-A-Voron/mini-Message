<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Mini Message — Pro</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="../shared/chat-shell.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pro">
  <div class="pro-layout">
    <div id="app"></div>

    <aside id="cliPanel" class="cli-panel">
      <div class="cli-header">
        <span>Командная строка</span>
        <span class="cli-shell-badge" id="cliShellBadge">cmd.exe</span>
      </div>
      <div class="cli-output" id="cliOutput"></div>
      <div class="cli-input-row">
        <span class="cli-prompt">&gt;</span>
        <input id="cliInput" type="text" placeholder="login --login alice --password ***" autocomplete="off" />
      </div>
      <p class="cli-hint">
        Работает так же из настоящего cmd.exe / PowerShell:
        <code>messenger_client.exe --cli login --login alice --password ***</code>
      </p>
    </aside>
  </div>

  <script src="../shared/bridge.js"></script>
  <script src="../shared/layout-renderer.js"></script>
  <script src="../shared/connection-indicator.js"></script>
  <script src="../shared/chat-shell.js"></script>
  <script src="../shared/settings-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
